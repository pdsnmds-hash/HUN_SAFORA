# ONE-TIME custom workflow for a NEW key, not an ordinary app build.
# Copy to repository-root codemagic.yaml ONLY when new key creation is intended.
# Before running: create secret group safora_key_generation with both passwords.
workflows:
  safora-create-upload-key-once:
    name: Safora - ONE-TIME create upload key
    instance_type: linux_x2
    max_build_duration: 15
    environment:
      java: 17
      groups:
        - safora_key_generation
      vars:
        KEYSTORE_NAME: safora-upload.jks
        UPLOAD_KEY_ALIAS: upload
        KEY_SUBJECT: "CN=Safora Hungary Kft., OU=Android, O=Safora Hungary Kft., L=Lajosmizse, C=HU"
    scripts:
      - name: Generate key and export public certificate
        script: |
          set -eu
          : "${NEW_KEYSTORE_PASSWORD:?Set the secret NEW_KEYSTORE_PASSWORD}"
          : "${NEW_KEY_PASSWORD:?Set the secret NEW_KEY_PASSWORD}"
          umask 077
          cd "$CM_BUILD_DIR"
          mkdir -p generated-signing
          test ! -e "generated-signing/$KEYSTORE_NAME"
          keytool -genkeypair -noprompt \
            -keystore "generated-signing/$KEYSTORE_NAME" \
            -storetype JKS -keyalg RSA -keysize 4096 \
            -validity 10000 -sigalg SHA256withRSA \
            -alias "$UPLOAD_KEY_ALIAS" -dname "$KEY_SUBJECT" \
            -storepass:env NEW_KEYSTORE_PASSWORD \
            -keypass:env NEW_KEY_PASSWORD
          keytool -exportcert -rfc \
            -keystore "generated-signing/$KEYSTORE_NAME" \
            -alias "$UPLOAD_KEY_ALIAS" \
            -storepass:env NEW_KEYSTORE_PASSWORD \
            -file generated-signing/upload_certificate.pem
    artifacts:
      - generated-signing/*.jks
      - generated-signing/upload_certificate.pem
